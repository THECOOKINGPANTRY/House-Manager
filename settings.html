<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Home Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-shell">
    <div class="phone">

      <div class="topbar">

        <div class="topbar-row">

          <a class="brand" href="index.html">

            <div class="brand-mark">
  <img src="House_Manager_Logo.png" alt="Home Manager logo">
</div>

            <div>
              <div class="brand-name">HOME MANAGER</div>
              <div class="brand-sub" id="houseNameHeader">
                My Household
              </div>
            </div>

          </a>

        </div>

      </div>

      <div class="scroll">

        <div class="kicker">Household</div>

        <h1>Settings</h1>

        <p>
          Control your household and prototype preferences.
        </p>

        <div class="section">

          <div class="section-title">
            Household
          </div>

          <div class="row">

            <div>

              <div class="member-name">
                Household name
              </div>

              <div
                class="member-role"
                id="nameView"
              ></div>

            </div>

            <button
              class="button outline small-button"
              onclick="renameHousehold()"
            >
              Rename
            </button>

          </div>

          <div class="row">

            <div>

              <div class="member-name">
                Invite code
              </div>

              <div
                class="member-role"
                id="codeView"
              ></div>

            </div>

            <button
              class="button outline small-button"
              onclick="copyInvite()"
            >
              Copy
            </button>

          </div>

        </div>

        <div class="section">

          <div class="section-title">
            Prototype data
          </div>

          <p>
            All test data is stored locally in this browser so the prototype works without a backend.
          </p>

          <div style="margin-top:14px">

            <button
              class="button danger full"
              onclick="resetApp()"
            >
              Clear household data
            </button>

          </div>

        </div>

      </div>

      <div class="bottom">

        <button class="fab" onclick="openAdd()">+</button>

        <a class="nav" href="index.html">
          <span class="nav-icon">⌂</span>
          Home
        </a>

        <a class="nav" href="tasks.html">
          <span class="nav-icon">✓</span>
          Tasks
        </a>

        <a class="nav" href="shopping.html">
          <span class="nav-icon">🛒</span>
          Shop
        </a>

        <a class="nav active" href="more.html">
          <span class="nav-icon">•••</span>
          More
        </a>

      </div>

    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="app.js"></script>

  <script>

    const d = getData();

    document.getElementById("nameView").textContent =
      d.household.name;

    document.getElementById("codeView").textContent =
      d.household.inviteCode;

  </script>

</body>
</html>
