<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar · Home Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-shell">
    <div class="phone">

      <div class="topbar">
        <div class="topbar-row">

          <a class="brand" href="index.html">

            <div class="brand-mark">
  <img src="House_Manager_Logo.png" alt="Home Manager logo">
</div>

            <div>
              <div class="brand-name">HOME MANAGER</div>
              <div class="brand-sub" id="houseNameHeader">My Household</div>
            </div>

          </a>

          <button
            class="header-action"
            onclick="location.href='settings.html'"
          >
            ⚙
          </button>

        </div>
      </div>

      <div class="scroll">

        <div class="kicker">Household</div>

        <h1>Calendar</h1>

        <p>Plans and events everyone can see.</p>

        <div class="calendar">

          <div class="calendar-head">
            <span>October 2026</span>
            <span>Today</span>
          </div>

          <div class="week">

            <div class="dayname">M</div>
            <div class="dayname">T</div>
            <div class="dayname">W</div>
            <div class="dayname">T</div>
            <div class="dayname">F</div>
            <div class="dayname">S</div>
            <div class="dayname">S</div>

          </div>

          <div class="week" id="days"></div>

        </div>

        <div class="toolbar">

          <div class="kicker">Upcoming</div>

          <button
            class="button primary small-button"
            onclick="openForm('event')"
          >
            + Add event
          </button>

        </div>

        <div id="events"></div>

      </div>

      <div class="bottom">

        <button class="fab" onclick="openAdd()">+</button>

        <a class="nav" href="index.html">
          <span class="nav-icon">⌂</span>
          Home
        </a>

        <a class="nav" href="tasks.html">
          <span class="nav-icon">✓</span>
          Tasks
        </a>

        <a class="nav" href="shopping.html">
          <span class="nav-icon">🛒</span>
          Shop
        </a>

        <a class="nav active" href="more.html">
          <span class="nav-icon">•••</span>
          More
        </a>

      </div>

    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="app.js"></script>

  <script>
    const days = document.getElementById("days");

    for (let i = 1; i <= 31; i++) {
      days.innerHTML += `
        <button class="day ${i === 1 ? "today" : ""}">
          ${i}
        </button>
      `;
    }

    const d = getData();

    document.getElementById("events").innerHTML =
      d.events.length
        ? d.events.map(x => `
          <div class="list-item">

            <div class="iconbox" style="margin:0">
              ▦
            </div>

            <div class="list-content">

              <div class="list-title">
                ${safe(x.title)}
              </div>

              <div class="list-meta">
                ${x.date ? fmtDate(x.date) : "No date"}
                ${x.time ? " · " + safe(x.time) : ""}
              </div>

            </div>

            <button
              class="icon-button"
              onclick="deleteEvent('${x.id}')"
            >
              ×
            </button>

          </div>
        `).join("")
        : emptyState(
            "▦",
            "Nothing planned yet",
            "Add an appointment, dinner, sports event or anything else your household needs to remember.",
            "Add an event",
            "openForm('event')"
          );
  </script>

</body>
</html>
