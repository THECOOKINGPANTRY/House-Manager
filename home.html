<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · Home Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-shell">
    <div class="phone">

      <div class="topbar">
        <div class="topbar-row">

          <a class="brand" href="index.html">

            <div class="brand-mark">
              <svg viewBox="0 0 64 64">
                <path fill="#242423" d="M13 25 32 10l19 15h-8L32 16l-11 9z"/>
                <rect x="19" y="37" width="7" height="20" rx="2.5" fill="#242423"/>
                <rect x="38" y="37" width="7" height="20" rx="2.5" fill="#242423"/>
                <rect x="22" y="44" width="20" height="6" rx="2.5" fill="#242423"/>
              </svg>
            </div>

            <div>
              <div class="brand-name">HOME MANAGER</div>
              <div class="brand-sub" id="houseNameHeader">My Household</div>
            </div>

          </a>

          <button
            class="header-action"
            onclick="location.href='settings.html'"
          >
            ⚙
          </button>

        </div>
      </div>

      <div class="scroll">

        <div class="kicker">Household</div>

        <h1>Home</h1>

        <p>
          Information about the place you all share.
        </p>

        <div class="toolbar">

          <div class="kicker">
            Home information
          </div>

          <button
            class="button primary small-button"
            onclick="addHomeInfoPrompt()"
          >
            + Add
          </button>

        </div>

        <div id="list"></div>

      </div>

      <div class="bottom">

        <button class="fab" onclick="openAdd()">+</button>

        <a class="nav" href="index.html">
          <span class="nav-icon">⌂</span>
          Home
        </a>

        <a class="nav" href="tasks.html">
          <span class="nav-icon">✓</span>
          Tasks
        </a>

        <a class="nav" href="shopping.html">
          <span class="nav-icon">🛒</span>
          Shop
        </a>

        <a class="nav active" href="more.html">
          <span class="nav-icon">•••</span>
          More
        </a>

      </div>

    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="app.js"></script>

  <script>
    function addHomeInfoPrompt() {

      const title = prompt("What is the information?");

      if (!title?.trim()) return;

      const value = prompt("Value / details");

      const d = getData();

      d.homeInfo.unshift({
        id: uid(),
        title: title.trim(),
        value: value?.trim() || ""
      });

      saveData(d);

      location.reload();
    }

    const d = getData();

    document.getElementById("list").innerHTML =
      d.homeInfo.length
        ? d.homeInfo.map(x => `
          <div class="list-item">

            <div class="iconbox" style="margin:0">
              ⌂
            </div>

            <div class="list-content">

              <div class="list-title">
                ${safe(x.title)}
              </div>

              <div class="list-meta">
                ${safe(x.value)}
              </div>

            </div>

            <button
              class="icon-button"
              onclick="deleteHomeInfo('${x.id}')"
            >
              ×
            </button>

          </div>
        `).join("")
        : emptyState(
            "⌂",
            "Nothing saved yet",
            "Store useful household details such as Wi-Fi information, appliance details, service contacts or maintenance notes.",
            "Add home information",
            "addHomeInfoPrompt()"
          );
  </script>

</body>
</html>
